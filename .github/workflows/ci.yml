name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.25.13"
  FOUNDATION_VERSION: "v2.4.0"
  GOVULNCHECK_VERSION: "v1.6.0"
  EUPROVGUARD_VERSION: "v1.2.1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install Foundation CLI
        run: go install github.com/mirkobrombin/go-foundation/dev/v2/cmd/foundation@${{ env.FOUNDATION_VERSION }}

      - name: Run tests three times
        shell: bash
        run: |
          set -euo pipefail
          for _ in 1 2 3; do
            go test -count=1 -shuffle=on -timeout=5m ./...
          done

      - name: Run tests with race detector
        run: go test -race -count=1 -timeout=10m ./...

      - name: Run vet
        run: go vet ./...

      - name: Check Foundation declarations
        run: foundation check ./...

      - name: Check generated registries
        run: foundation generate -check ./...

      - name: Scan vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  compliance:
    name: Compliance
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install EUProvGuard
        run: go install github.com/fabricatorsltd/euprovguard@${{ env.EUPROVGUARD_VERSION }}

      - name: Resolve project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            echo "value=0.0.0-${GITHUB_SHA:0:7}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Scan module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compliance
          euprovguard \
            -path . \
            -name go-warp \
            -version-tag "${{ steps.version.outputs.value }}" \
            -output compliance/sbom.json \
            -bundle compliance/report 2>&1 | tee compliance/scan.log

      - name: Fail on compliance findings
        shell: bash
        run: |
          set -euo pipefail
          sbom="compliance/sbom.json"
          log="compliance/scan.log"

          recorded=$(jq '(.vulnerabilities // []) | length' "${sbom}")
          cves=$(sed -n 's/.*CVE findings: \([0-9][0-9]*\).*/\1/p' "${log}" | tail -n 1)
          sast=$(sed -n 's/.*Native SAST completed: found \([0-9][0-9]*\) issues.*/\1/p' "${log}" | tail -n 1)

          echo "module: sbom=${recorded} cve=${cves:-missing} sast=${sast:-missing}"

          if [ -z "${cves}" ] || [ -z "${sast}" ]; then
            echo "::error::EUProvGuard summary could not be parsed"
            exit 1
          fi
          if grep -q "OSV/EUVD query failed" "${log}"; then
            echo "::error::vulnerability databases were unreachable"
            exit 1
          fi
          if [ "${recorded}" -gt 0 ] || [ "${cves}" -gt 0 ] || [ "${sast}" -gt 0 ]; then
            echo "::error::EUProvGuard reported findings"
            exit 1
          fi

      - name: Upload compliance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compliance-reports
          path: compliance/
          if-no-files-found: error

  release:
    name: Release
    needs: [build, test, compliance]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download compliance artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi

      - name: Upload compliance artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find artifacts -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no compliance artifacts to publish"
            exit 1
          fi
          printf '%s\n' "${assets[@]}"
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
